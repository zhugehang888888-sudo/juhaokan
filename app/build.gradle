plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oriontv.plus'
    compileSdk 34

    defaultConfig {
        applicationId "com.juhaokan.yingshi"
        minSdk 23
        targetSdk 34
        versionCode 56
        versionName "1.8.8"
        resConfigs "zh", "en"

        // 服务端相关配置：开源版全部留空，由用户在登录页手动填写。
        // 如需自行内置，可在 local.properties 中读取后在这里赋值。
        buildConfigField "boolean", "BUILT_IN_SERVER", "false"
        buildConfigField "boolean", "SHOW_BRAND", "false"
        buildConfigField "String", "SERVER_URL", '""'
        buildConfigField "String", "SERVER_USER", '""'
        buildConfigField "String", "SERVER_PASS", '""'
        buildConfigField "String", "LIVE_SOURCES", '""'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 开源仓库不附带签名证书，release 直接使用 debug 签名，方便自行构建安装。
            // 正式发布请替换为自己的 keystore。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}
